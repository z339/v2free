name: "Airport Checkin"

# 说明：GitHub Actions 不允许在 on.schedule.cron 里使用变量/表达式，
# 所以采用「高频轮询 + 时间门控」模式：每 5 分钟跑一次，
# 仅在到达变量 SCHEDULED 指定的北京时间时才真正执行签到。
on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟检查一次（UTC）
  workflow_dispatch:

env:
  RUN_ENV: 'prod'

permissions:
  contents: write   # 用于写入“今日已签到”标记，防止同一天重复运行

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 判断是否到签到时间
        id: gate
        env:
          # 默认定时：北京时间 05:03。设置了仓库 Variables 中的 SCHEDULED 则用它，否则用默认。
          SCHEDULED: ${{ vars.SCHEDULED || '0503' }}
        run: |
          python3 - <<'PY'
          import datetime, os
          # 默认定时（北京时间 HHMM）。环境变量 SCHEDULED 有设置就用它，否则用默认 '0503'。
          DEFAULT_SCHEDULED = "0503"
          scheduled = os.environ.get("SCHEDULED") or DEFAULT_SCHEDULED
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          now_hm = now.strftime("%H%M")
          today = now.strftime("%Y-%m-%d")
          is_dispatch = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          try:
              last = open(".signed_date").read().strip()
          except FileNotFoundError:
              last = ""
          # 手动触发总是执行；定时触发需：今天还没签过 且 当前北京时间已到设定时刻
          should = is_dispatch or (last != today and now_hm >= scheduled)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should else 'false'}\n")
          print(f"now={now_hm} scheduled={scheduled} last_signed={last or '无'} should_run={should}")
          PY

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Random sleep
        if: steps.gate.outputs.should_run == 'true'
        run: sleep $(shuf -i 10-300 -n 1)

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        if: steps.gate.outputs.should_run == 'true'
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          SCKEY: ${{ secrets.SCKEY }}
          TGBOT: ${{ secrets.TGBOT }}
          TGUSERID: ${{ secrets.TGUSERID }}
        run: |
          python3 ./main.py

      - name: 写入今日已签到标记
        if: steps.gate.outputs.should_run == 'true'
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "$TODAY" > .signed_date
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .signed_date
          git commit -m "chore: 标记 $TODAY 已签到" || echo "无变化"
          git push
